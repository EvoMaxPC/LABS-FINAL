name: EVO Recovery — Validación
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'recovery/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Comprobar TypeScript
        run: npx tsc --noEmit
      - name: Compilar
        run: npm run build
      - name: Ejecutar regresión estructural
        run: npm run evo:regression
